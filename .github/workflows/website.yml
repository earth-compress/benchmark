name: website

on:
  push:
    branches: [main]
    paths:
      - "corpora/**"
      - "website/**"
      - "earthcompress/**"
      - "*.md"
      - "docs/assets/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Reuse the previews fetched from Hugging Face
        uses: actions/cache@v4
        with:
          path: .cache/site
          key: previews-${{ hashFiles('corpora/*/manifest.csv') }}
          restore-keys: previews-
      - name: Build the site from the repository
        run: uv run --extra site python website/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
