<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Compress benchmark</title>
<meta name="description" content="{tagline}">
<link rel="icon" href="earth-compress.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<div class="wrap bar">
<a class="brand" href="#top"><picture><source media="(prefers-color-scheme: dark)" srcset="earth-compress-dark.svg"><img src="earth-compress.svg" alt="Earth Compress" height="30"></picture><span class="version">benchmark v1.0</span></a>
<nav><a href="#top">Results</a><a href="#datasets">Datasets</a><a href="{repo}">GitHub</a></nav>
</div>
</header>
<main id="top" class="wrap">
<section class="results">
<div class="controls">
<div class="tabs" role="tablist" aria-label="Fidelity mode">
<button type="button" role="tab" aria-controls="panel-lossless" aria-selected="true">Lossless</button>
<button type="button" role="tab" aria-controls="panel-near" aria-selected="false">Near-lossless <span class="soon">soon</span></button>
<button type="button" role="tab" aria-controls="panel-lossy" aria-selected="false">Lossy <span class="soon">soon</span></button>
</div>
<label class="pick">{badge}<select id="corpus" aria-label="Corpus"><option value="all">All corpora</option>{options}</select></label>
</div>
<div class="panel" role="tabpanel" id="panel-lossless">
<div class="chart" id="chart"></div>
</div>
<div class="panel soonpanel" role="tabpanel" id="panel-near" hidden><p>Coming soon.</p></div>
<div class="panel soonpanel" role="tabpanel" id="panel-lossy" hidden><p>Coming soon.</p></div>
</section>

<section id="datasets">
<h2>Datasets</h2>
<div class="grid">
{cards}
</div>
</section>
</main>
<footer><div class="wrap">
<p class="links"><a href="{repo}/blob/main/PROTOCOL.md">Protocol</a><a href="{repo}/blob/main/CODECS.md">Codecs</a><a href="{repo}/blob/main/TOLERANCE.md">Tolerance</a><a href="{repo}/blob/main/DATASETS.md">Datasets</a></p>
<p>Part of <a href="https://asterisk.coop/project-pages/earth-compress.html">Earth Compress</a>, funded by <a href="https://www.aria.org.uk/">ARIA</a> and led by the <a href="https://noc.ac.uk/">National Oceanography Centre</a> and <a href="https://asterisk.coop/">Asterisk Labs</a>. <a href="{repo}/blob/main/LICENSE">Apache 2.0</a>.</p>
</div></footer>
<script>
const DATA = {data};
const CODECS = {codecs};
const NS = "http://www.w3.org/2000/svg";
const STILL = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function el(name, attrs, text) {{
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}}
function frontier(points) {{
  const sorted = [...points].sort((a, b) => b.speed - a.speed);
  const front = [];
  let best = -Infinity;
  for (const p of sorted) if (p.ratio > best) {{ front.push(p); best = p.ratio; }}
  return front;
}}
function draw(corpus) {{
  const totals = DATA[corpus] || {{}};
  const points = CODECS.filter(c => totals[c]).map(c => ({{
    id: c,
    ratio: totals[c].input / totals[c].compressed,
    speed: totals[c].input / 1e6 / (totals[c].decode_ns / 1e9),
  }}));
  const box = document.getElementById("chart");
  const W = Math.max(320, box.clientWidth || 960);
  const H = Math.round(Math.max(300, Math.min(520, W * 0.56)));
  const L = 48, R = W < 600 ? 96 : 150, T = 40, B = 54;
  const svg = el("svg", {{ viewBox: `0 0 ${{W}} ${{H}}`, role: "img", "aria-label": "Compression ratio against decode speed" }});
  const speeds = points.map(p => p.speed), ratios = points.map(p => p.ratio);
  const x0 = Math.log10(Math.min(...speeds, 100) / 1.5), x1 = Math.log10(Math.max(...speeds, 1000) * 1.5);
  const y0 = 1, y1 = Math.max(1.5, Math.ceil(Math.max(...ratios, 1) * 1.1 * 4) / 4);
  const X = v => L + (Math.log10(v) - x0) / (x1 - x0) * (W - L - R);
  const Y = v => H - B - (v - y0) / (y1 - y0) * (H - T - B);
  const axes = el("g", {{ class: "axes" }});
  const narrow = W < 600;
  for (const v of narrow ? [10, 100, 1000, 10000] : [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000]) {{
    if (Math.log10(v) < x0 || Math.log10(v) > x1) continue;
    axes.append(el("line", {{ x1: X(v), x2: X(v), y1: T, y2: H - B, class: "grid" }}));
    axes.append(el("text", {{ x: X(v), y: H - B + 20, class: "tick", "text-anchor": "middle" }}, v.toLocaleString("en")));
  }}
  const step = y1 - y0 > 2 ? 0.5 : 0.25;
  for (let v = y0; v <= y1 + 1e-9; v += step) {{
    axes.append(el("line", {{ x1: L, x2: W - R, y1: Y(v), y2: Y(v), class: "grid" }}));
    axes.append(el("text", {{ x: L - 10, y: Y(v) + 4, class: "tick", "text-anchor": "end" }}, v.toFixed(2)));
  }}
  axes.append(el("text", {{ x: W - R, y: H - 8, class: "axis", "text-anchor": "end" }}, "decode MB/s →"));
  axes.append(el("text", {{ x: L, y: T - 14, class: "axis" }}, "↑ compression ratio"));
  svg.append(axes);
  const front = frontier(points);
  if (front.length > 1) {{
    const path = el("path", {{ class: "pareto", d: front.map((p, i) => `${{i ? "L" : "M"}}${{X(p.speed)}},${{Y(p.ratio)}}`).join(" ") }});
    svg.append(path);
  }}
  const onFront = new Set(front.map(p => p.id));
  const order = [...points].sort((a, b) => a.speed - b.speed);
  const placed = [];
  const free = box => !placed.some(o => box.x < o.x + o.w && o.x < box.x + box.w && box.y < o.y + o.h && o.y < box.y + box.h);
  points.forEach(p => placed.push({{ x: X(p.speed) - 7, y: Y(p.ratio) - 7, w: 14, h: 14 }}));
  order.forEach((p, i) => {{
    const g = el("g", {{ class: "point" + (onFront.has(p.id) ? " front" : ""), style: `--i:${{i}}` }});
    g.append(el("title", {{}}, `${{p.id}}: ratio ${{p.ratio.toFixed(2)}}, decode ${{Math.round(p.speed).toLocaleString("en")}} MB/s`));
    g.append(el("circle", {{ cx: X(p.speed), cy: Y(p.ratio), r: 6 }}));
    if (narrow && !onFront.has(p.id)) {{ svg.append(g); return; }}
    const w = p.id.length * (narrow ? 6.7 : 7.9), cx = X(p.speed), cy = Y(p.ratio);
    const spots = [[cx + 10, cy + 4, "start"], [cx - 10, cy + 4, "end"], [cx + 8, cy - 10, "start"], [cx + 8, cy + 20, "start"], [cx - 8, cy - 10, "end"], [cx - 8, cy + 20, "end"]];
    const fits = s => {{
      const b = {{ x: s[2] === "end" ? s[0] - w : s[0], y: s[1] - 12, w, h: 15 }};
      return b.x > L && b.x + w < W ? b : null;
    }};
    const spot = spots.find(s => fits(s) && free(fits(s))) || spots.find(fits) || spots[0];
    if (fits(spot)) placed.push(fits(spot));
    g.append(el("text", {{ x: spot[0], y: spot[1], "text-anchor": spot[2], class: "label" }}, p.id));
    svg.append(g);
  }});
  if (!points.length) svg.append(el("text", {{ x: (W - R) / 2, y: H / 2, class: "axis", "text-anchor": "middle" }}, "No results yet"));
  box.replaceChildren(svg);
  const path = svg.querySelector(".pareto");
  if (path && !STILL) {{
    const length = path.getTotalLength();
    path.style.strokeDasharray = length;
    path.animate(
      [{{ strokeDashoffset: length }}, {{ strokeDashoffset: 0 }}],
      {{ duration: 1100, delay: order.length * 90 + 350, easing: "ease-in-out", fill: "backwards" }},
    );
  }}
  svg.getBoundingClientRect();
  svg.classList.add("in");
}}
const corpusSelect = document.getElementById("corpus");
corpusSelect.addEventListener("change", () => draw(corpusSelect.value));
let lastWidth = 0;
new ResizeObserver(entries => {{
  const width = Math.round(entries[0].contentRect.width);
  if (Math.abs(width - lastWidth) > 40) {{ lastWidth = width; draw(corpusSelect.value); }}
}}).observe(document.getElementById("chart"));
const tabs = [...document.querySelectorAll('[role="tab"]')];
tabs.forEach(tab => tab.addEventListener("click", () => {{
  tabs.forEach(t => {{
    const on = t === tab;
    t.setAttribute("aria-selected", String(on));
    document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
  }});
  document.querySelector(".pick").style.visibility = tab === tabs[0] ? "visible" : "hidden";
}}));
</script>
</body>
</html>
