[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "earthcompress"
version = "0.1.0"
description = "Compression benchmark for Earth observation arrays."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Asterisk Labs" }]
keywords = ["compression", "earth-observation", "remote-sensing", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "typer>=0.20,<1", "zstandard>=0.22"]

[project.optional-dependencies]
corpus = [
    "Pillow>=10",
    "rasterio>=1.4",
    "earthengine-api>=1.5",
    "cdsapi>=0.7",
    "eccodes>=2.42",
    "eccodeslib>=2.42",
    "pyarrow>=15",
]
site = ["markdown>=3.5", "Pillow>=10"]

[project.scripts]
earthcompress = "earthcompress.__main__:main"

[project.urls]
Homepage = "https://github.com/earth-compress/benchmark"
Repository = "https://github.com/earth-compress/benchmark"
Issues = "https://github.com/earth-compress/benchmark/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["earthcompress"]

[tool.hatch.build.targets.sdist]
exclude = ["**/npz/**", "**/png/**"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "BLE", "E4", "E7", "E9", "F", "I", "SIM", "UP"]
